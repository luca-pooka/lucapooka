<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" lang="en"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake - LucaPooka</title>
    <link rel="stylesheet" href="../basic.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="../mii.png">

</head>
<body>
    <h1>Snake</h1>
    <div id="settings">
        <input type="range" min="1" max="4" value="2" id="speed-input" oninput="updateSpeed()">
        <p id="speed">Speed: Normal</p>
        <p id="high-scores">High Score: 0</p>
        <button onclick="startGame()">Start Game</button>
    </div>
    <h2 id="score">Score: 0</h2>
    <button id="replay" onclick="replayGame()">Play Again</button>
    <button id="change" onclick="reshowSettings()">Change Speed</button>
    <div>
        <div id="grid"></div>
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7936100714719113"
            crossorigin="anonymous"></script>
        <!-- Vertical -->
        <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-7936100714719113"
            data-ad-slot="9135604398"
            data-ad-format="auto"
        data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
        <div id="grid"></div>
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7936100714719113"
            crossorigin="anonymous"></script>
        <!-- Vertical -->
        <ins class="adsbygoogle"
            style="display:block"

            data-ad-format="auto"
        data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>
    <h3 id="pause">Click esc to pause</h3>
    <footer>
        <h2>Made by <a href="../">LucaPooka</a></h2>
        <img src="../mii.png" alt="My Mii" height="50px" width="50px">
    </footer>
    <p id="footer-toggle">⌄</p>
    <script src="script.js"></script>
    <script type="module" src="../basic.js"></script>
</body>
</html>
