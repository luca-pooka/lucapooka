<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" lang="en"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdowns - LucaPooka</title>
    <link rel="stylesheet" href="../basic.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="../mii.png">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7936100714719113" crossorigin="anonymous"></script>
</head>
<body>
    <h1>Countdowns</h1>
    <button onclick="addCountdown()">Add New Countdown</button>
    <div>
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7936100714719113"
        crossorigin="anonymous"></script>
        <!-- Vertical -->
        <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-7936100714719113"
            data-ad-slot="9135604398"
            data-ad-format="auto"
            data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
        <div id="countdowns"></div>
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7936100714719113"
        crossorigin="anonymous"></script>
        <!-- Vertical -->
        <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-7936100714719113"
            data-ad-slot="9135604398"
            data-ad-format="auto"
            data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>
    <div id="overlay">
        <div id="popup">
            <h2>Add Countdown</h2>
            <input type="text" placeholder="Title" id="title">
            <br>
            <br>
            <label for="date">Counting down to: </label>
            <br>
            <input type="date" id="date">
            <br>
            <label for="all-day">All day?</label>
            <input type="checkbox" id="all-day" checked>
            <br>
            <br>
            <button onclick="cancel()">Cancel</button>
            <button onclick="submit()" id="submit">Submit</button>
        </div>
    </div>
    <footer>
        <h2>Made by <a href="../">LucaPooka</a></h2>
        <img src="../mii.png" alt="My Mii" height="50px" width="50px">
    </footer>
    <p id="footer-toggle">⌄</p>
    <script src="script.js"></script>
    <script type="module" src="../basic.js"></script>
</body>
</html>
