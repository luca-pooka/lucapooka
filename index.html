<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" lang="en"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LucaPooka - Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="basic.css">
    <link rel="icon" href="mii.png">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7936100714719113" crossorigin="anonymous"></script>
</head>
<body>
    <h1>Welcome to the LucaPooka Hub!</h1>
    <h2>Games and more, all originally made by me.</h2>
    <img src="mii.png" alt="Image of my (Luca's) Mii" height="85px" width="85px" title="it's mii!">
    <br>
    <div id="checkboxes">
        <div id="order-container">
            <label for="order-select">Order projects by:</label>
            <select name="order" id="order-select">
                <option value="default">Default Order</option>
                <option value="newest">Newest to Oldest</option>
                <option value="oldest">Oldest to Newest</option>
                <option value="alphabetical-asc">Alphabetical Ascending</option>
                <option value="alphabetical-desc">Alphabetical Descending</option>
            </select>
        </div>
        <h3>Tags:</h3>
        <p>(hover each icon for info, click on them to filter by)</p>
        <div id="tags"></div>
    </div>
    <div id="apps"></div>
    <a id="privacy" href="privacypolicy.html">Privacy Policy</a>
    <p id="theme-change">Change site theme</p>
    <div id="overlay">
        <div id="popup">
            <h2>Change Site Theme</h2>
            <table id="themes-table">
                <tr>
                    <th>Theme</th>
                    <th>Apply</th>
                </tr>
            </table>
            <br>
            <button id="theme-change-cancel">Back</button>
        </div>
    </div>
    <p>New projects will be added from time to time <s>when I get ideas</s>.</p>
    <div class="horizontal-ad">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7936100714719113"
            crossorigin="anonymous"></script>
        <ins class="adsbygoogle"
            style="display:block"
            data-ad-format="autorelaxed"
            data-ad-client="ca-pub-7936100714719113"
            data-ad-slot="4825189217"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>
    <script type="module" src="script.js"></script>
    <script type="module" src="basic.js"></script>
</body>
</html>
